name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: min-portfolio/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: min-portfolio

      - name: Build
        run: npm run build
        working-directory: min-portfolio

      - name: Copy index.html to 404.html (for React Router)
        run: cp min-portfolio/dist/index.html min-portfolio/dist/404.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: min-portfolio/dist

      - uses: actions/deploy-pages@v4
        id: deployment
